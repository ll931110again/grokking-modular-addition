[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning"
version = "0.1.0"
description = "Grokking modular-addition scaffold and ML experiments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools]
py-modules = ["grokking_modular_addition", "grokking_synthetic_lm", "grokfast"]
